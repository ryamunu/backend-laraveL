version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: overskull_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: overskull_db
      MYSQL_USER: overskull
      MYSQL_PASSWORD: secret
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - overskull_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # PHP-FPM Application
  php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: overskull_php
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    environment:
      - APP_ENV=local
      - DB_HOST=mysql
      - DB_DATABASE=overskull_db
      - DB_USERNAME=overskull
      - DB_PASSWORD=secret
    networks:
      - overskull_net
    depends_on:
      mysql:
        condition: service_healthy

  # Nginx Web Server
  nginx:
    image: nginx:alpine
    container_name: overskull_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - overskull_net
    depends_on:
      - php

volumes:
  mysql_data:

networks:
  overskull_net:
    driver: bridge
